<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" fill="none" role="img" aria-label="Layered Rust L0-L5 architecture diagram (dark theme)">
  <defs>
    <linearGradient id="accent-bar" x1="24" y1="0" x2="856" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9FC8FF" />
      <stop offset="35%" stop-color="#6FD8EE" />
      <stop offset="70%" stop-color="#FFC48A" />
      <stop offset="100%" stop-color="#FF9F88" />
    </linearGradient>
    <linearGradient id="bg-card" x1="0" y1="0" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0E0E11" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="328" rx="18" fill="url(#bg-card)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
  <rect x="24" y="1" width="832" height="2" rx="1" fill="url(#accent-bar)" opacity="0.65" />

  <!-- Column 1: Pure Core L0-L2 -->
  <rect x="24" y="24" width="244" height="222" rx="14" fill="rgba(111,216,238,0.04)" stroke="rgba(111,216,238,0.22)" stroke-width="1" />
  <text x="40" y="48" fill="#6FD8EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">PURE CORE · ZERO I/O</text>

  <rect x="38" y="62" width="216" height="50" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="52" y="83" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L0 · primitives</text>
  <text x="52" y="101" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Value types, enums, IDs</text>

  <rect x="38" y="122" width="216" height="50" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="52" y="143" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L1 · spec</text>
  <text x="52" y="161" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CommandId, policies, ts-rs DTOs</text>

  <rect x="38" y="182" width="216" height="50" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="52" y="203" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L2 · domain</text>
  <text x="52" y="221" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Pure parsers, state, rules R1..Rn</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M274 135 H296 M291 130 L297 135 L291 140" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Column 2: Store & Engine L3-L4 -->
  <rect x="304" y="24" width="272" height="222" rx="14" fill="rgba(159,200,255,0.04)" stroke="rgba(159,200,255,0.22)" stroke-width="1" />
  <text x="320" y="48" fill="#9FC8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">ORCHESTRATION &amp; STATE</text>

  <rect x="318" y="62" width="244" height="72" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="332" y="84" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L3 · store</text>
  <text x="332" y="103" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Only persistence boundary</text>
  <text x="332" y="120" fill="#9FC8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Postgres RLS · SQLite · JSON</text>

  <rect x="318" y="146" width="244" height="86" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.14)" />
  <text x="332" y="168" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L4 · engine</text>
  <text x="332" y="187" fill="rgba(255,255,255,0.62)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CommandRegistry · Engine::execute</text>
  <text x="332" y="204" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CatchUnwind boundary · Audit trail</text>
  <text x="332" y="220" fill="#6FD8EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Defines L5 port traits (inverted)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M582 135 H604 M599 130 L605 135 L599 140" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Column 3: L5 Integrations & Apps -->
  <rect x="612" y="24" width="244" height="222" rx="14" fill="rgba(255,196,138,0.04)" stroke="rgba(255,196,138,0.22)" stroke-width="1" />
  <text x="628" y="48" fill="#FFC48A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">ADAPTERS &amp; SURFACES</text>

  <rect x="626" y="62" width="216" height="66" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="640" y="84" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L5 · integrations</text>
  <text x="640" y="102" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">HTTP (reqwest), subprocesses,</text>
  <text x="640" y="117" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OS APIs, timeouts &amp; caps</text>

  <rect x="626" y="140" width="216" height="92" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.1)" />
  <text x="640" y="162" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Apps &amp; Modern UI</text>
  <text x="640" y="182" fill="#FFC48A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Service: Axum · MCP · Worker</text>
  <text x="640" y="200" fill="#FF9F88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Desktop: Tauri v2 · Tray · CLI</text>
  <text x="640" y="218" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">React 19 + Tailwind v4 + ts-rs</text>

  <!-- Bottom Verification Gate Bar -->
  <rect x="24" y="262" width="832" height="46" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.12)" />
  <text x="42" y="290" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">cargo run -p xtask -- verify</text>

  <rect x="292" y="273" width="82" height="24" rx="7" fill="rgba(111,216,238,0.12)" stroke="rgba(111,216,238,0.3)" />
  <text x="333" y="289" text-anchor="middle" fill="#6FD8EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">layers</text>

  <rect x="386" y="273" width="82" height="24" rx="7" fill="rgba(111,216,238,0.12)" stroke="rgba(111,216,238,0.3)" />
  <text x="427" y="289" text-anchor="middle" fill="#6FD8EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">purity</text>

  <rect x="480" y="273" width="112" height="24" rx="7" fill="rgba(159,200,255,0.12)" stroke="rgba(159,200,255,0.3)" />
  <text x="536" y="289" text-anchor="middle" fill="#9FC8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ts-rs codegen</text>

  <rect x="604" y="273" width="128" height="24" rx="7" fill="rgba(255,196,138,0.12)" stroke="rgba(255,196,138,0.3)" />
  <text x="668" y="289" text-anchor="middle" fill="#FFC48A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">clippy -D warn</text>

  <rect x="744" y="273" width="96" height="24" rx="7" fill="rgba(255,159,136,0.12)" stroke="rgba(255,159,136,0.3)" />
  <text x="792" y="289" text-anchor="middle" fill="#FF9F88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">tests + rls</text>
</svg>
