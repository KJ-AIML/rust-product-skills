<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" fill="none" role="img" aria-label="Layered Rust L0-L5 architecture diagram (light theme)">
  <defs>
    <linearGradient id="accent-bar-light" x1="24" y1="0" x2="856" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="328" rx="18" fill="#FAFAFB" stroke="#E4E4E7" stroke-width="1.2" />
  <rect x="24" y="1" width="832" height="2.5" rx="1" fill="url(#accent-bar-light)" opacity="0.85" />

  <!-- Column 1: Pure Core L0-L2 -->
  <rect x="24" y="24" width="244" height="222" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
  <text x="40" y="48" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">PURE CORE · ZERO I/O</text>

  <rect x="38" y="62" width="216" height="50" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="52" y="83" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L0 · primitives</text>
  <text x="52" y="101" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Value types, enums, IDs</text>

  <rect x="38" y="122" width="216" height="50" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="52" y="143" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L1 · spec</text>
  <text x="52" y="161" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CommandId, policies, ts-rs DTOs</text>

  <rect x="38" y="182" width="216" height="50" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="52" y="203" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L2 · domain</text>
  <text x="52" y="221" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Pure parsers, state, rules R1..Rn</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M274 135 H296 M291 130 L297 135 L291 140" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Column 2: Store & Engine L3-L4 -->
  <rect x="304" y="24" width="272" height="222" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
  <text x="320" y="48" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">ORCHESTRATION &amp; STATE</text>

  <rect x="318" y="62" width="244" height="72" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="332" y="84" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L3 · store</text>
  <text x="332" y="103" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Only persistence boundary</text>
  <text x="332" y="120" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Postgres RLS · SQLite · JSON</text>

  <rect x="318" y="146" width="244" height="86" rx="10" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="332" y="168" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L4 · engine</text>
  <text x="332" y="187" fill="#3F3F46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CommandRegistry · Engine::execute</text>
  <text x="332" y="204" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CatchUnwind boundary · Audit trail</text>
  <text x="332" y="220" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Defines L5 port traits (inverted)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M582 135 H604 M599 130 L605 135 L599 140" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Column 3: L5 Integrations & Apps -->
  <rect x="612" y="24" width="244" height="222" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" />
  <text x="628" y="48" fill="#C2410C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.2">ADAPTERS &amp; SURFACES</text>

  <rect x="626" y="62" width="216" height="66" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="640" y="84" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">L5 · integrations</text>
  <text x="640" y="102" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">HTTP (reqwest), subprocesses,</text>
  <text x="640" y="117" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OS APIs, timeouts &amp; caps</text>

  <rect x="626" y="140" width="216" height="92" rx="10" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="640" y="162" fill="#111114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Apps &amp; Modern UI</text>
  <text x="640" y="182" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Service: Axum · MCP · Worker</text>
  <text x="640" y="200" fill="#C2410C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Desktop: Tauri v2 · Tray · CLI</text>
  <text x="640" y="218" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">React 19 + Tailwind v4 + ts-rs</text>

  <!-- Bottom Verification Gate Bar -->
  <rect x="24" y="262" width="832" height="46" rx="12" fill="#FFFFFF" stroke="#E4E4E7" />
  <text x="42" y="290" fill="#111114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">cargo run -p xtask -- verify</text>

  <rect x="292" y="273" width="82" height="24" rx="7" fill="#CCFBF1" stroke="#5EEAD4" />
  <text x="333" y="289" text-anchor="middle" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">layers</text>

  <rect x="386" y="273" width="82" height="24" rx="7" fill="#CCFBF1" stroke="#5EEAD4" />
  <text x="427" y="289" text-anchor="middle" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">purity</text>

  <rect x="480" y="273" width="112" height="24" rx="7" fill="#DBEAFE" stroke="#93C5FD" />
  <text x="536" y="289" text-anchor="middle" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ts-rs codegen</text>

  <rect x="604" y="273" width="128" height="24" rx="7" fill="#FEF3C7" stroke="#FCD34D" />
  <text x="668" y="289" text-anchor="middle" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">clippy -D warn</text>

  <rect x="744" y="273" width="96" height="24" rx="7" fill="#FFEDD5" stroke="#FDBA74" />
  <text x="792" y="289" text-anchor="middle" fill="#C2410C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">tests + rls</text>
</svg>
